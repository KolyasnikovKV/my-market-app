plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.gorylenko.gradle-git-properties' version '2.4.2'
    id 'org.openapi.generator' version '7.12.0'
}

springBoot {
    buildInfo()
}

bootJar {
    enabled = true
    launchScript()
}

jar {
    enabled false
}

group = 'ru.yandex.practicum.payment.service'
version = '1.0.0-SNAPSHOT'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.34'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.redis:testcontainers-redis:2.2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/build/generated"
        }
    }
}

openApiGenerate {
    generatorName.set("spring")
    inputSpec.set("$projectDir/src/main/resources/api-spec.yaml")
    outputDir.set(project.layout.buildDirectory.dir('generated-sources/openapi-server').get().asFile.absolutePath)
    skipValidateSpec.set(false)
    packageName.set('ru.yandex.practicum.payment.service')
    modelPackage.set("ru.yandex.practicum.payment.service.model")
    invokerPackage.set("ru.yandex.practicum.payment.service")
    apiPackage.set("ru.yandex.practicum.payment.service.api")
    configOptions.set([
            library        : "spring-boot",
            reactive       : "true",
            useSpringBoot3 : "true",
            java8          : 'true',
            useTags        : "true",
            sourceFolder   : "src/main/java",
            openApiNullable: "false",
            interfaceOnly  : "true"
    ])
}

sourceSets {
    main {
        java {
            srcDirs += file("$buildDir/generated-sources/openapi-server/src/main/java")
        }
    }
    test {
        java {
            srcDirs += file("$buildDir/generated-sources/openapi-server/src/test/java")
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate
compileTestJava.dependsOn tasks.openApiGenerate

clean.doLast {
    delete "$projectDir/build/generated/openapi-server"
}

tasks.named('test') {
    failFast = true
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    testLogging {
        events = ['FAILED', 'PASSED', 'SKIPPED']
    }
}

checkstyle {
    configDirectory.set(file("$rootProject.projectDir/checkstyle"))
}

tasks.withType(Checkstyle).configureEach {
    def generatedDir = layout.buildDirectory.dir('generated-sources/openapi-server').get().asFile

    source = source.filter { file ->
        !file.absolutePath.startsWith(generatedDir.absolutePath)
    }
}

jacoco {
    toolVersion = '0.8.12'
}

def jacocoExclusions = [
        'ru/yandex/**/api/**',
        'ru/yandex/**/model/**',
        'ru.yandex.practicum.payment.service.impl.PaymentServiceImpl'

]

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = jacocoExclusions.stream().map { it.replace('/', '.') }.collect()
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.0
            }
            limit {
                counter = 'METHOD'
                minimum = 0.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.0
            }
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclusions)
        }))
    }
}

check.dependsOn jacocoTestCoverageVerification