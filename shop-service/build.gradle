import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.12.0'
}

group = 'yandex.practicum'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	testCompileOnly {
		extendsFrom testAnnotationProcessor
	}
}

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	compileOnly 'org.projectlombok:lombok'
	testImplementation 'io.projectreactor:reactor-test'

	runtimeOnly 'org.postgresql:r2dbc-postgresql'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql' // JDBC драйвер для Flyway

	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'io.swagger.core.v3:swagger-annotations:2.2.34'

	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:r2dbc'
	testImplementation 'com.redis:testcontainers-redis:2.2.2'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('buildClient', GenerateTask) {
	generatorName.set("java")
	inputSpec.set("$projectDir/../payment-service/src/main/resources/api-spec.yaml")
	outputDir.set(project.layout.buildDirectory.dir('generated-sources/openapi-client').get().asFile.absolutePath)
	skipValidateSpec.set(false)
	packageName.set('yandex.practicum.market.client')
	modelPackage.set('yandex.practicum.market.client.model')
	apiPackage.set('yandex.practicum.market.client.api')
	invokerPackage.set('yandex.practicum.market.client')
	configOptions.set([
			library        : 'webclient',
			reactive       : 'true',
			useJakartaEe   : 'true',
			java8          : 'true',
			useTags        : 'true',
			sourceFolder   : 'src/main/java',
			openApiNullable: 'false'
	])
}

sourceSets {
	main {
		java {
			srcDirs += file("$buildDir/generated-sources/openapi-client/src/main/java")
		}
	}
	test {
		java {
			srcDirs += file("$buildDir/generated-sources/openapi-client/src/test/java")
		}
	}
}

compileJava.dependsOn buildClient
compileTestJava.dependsOn buildClient

clean.doLast {
	delete "$projectDir/build/generated/openapi-client"
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
	jvmArgs = [
			"-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}",
			"-Xshare:off"
	]
}

springBoot {
	buildInfo()  // исполнение задачи по добавлению информации о сборке
}
